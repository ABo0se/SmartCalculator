<html lang="th">

<head>
	<meta charset="UTF-8">
	<title>Pangya Pin Exporter</title>
	<style>
		#display-container {
			width: 100%;
			height: 100%;
		}

		#status-display {
			position: absolute;
			bottom: 100px;
			right: 20px;
			color: cyan;
		}

		#status-display ul {
			list-style-type: none;
		}

		#stats {
			position: absolute;
			top: 15px;
			left: 15px;
		}

		div .dg {
			position: absolute;
			top: 20px;
			right: 20px;
		}

		.label {
			grid-column: 1 / 2;
			color:pink;
		}

		.input {
			grid-column: 2 / 3;
		}
		
		.container-grid {
			display: grid;
			grid-template-columns: auto 120px auto;
			grid-row-gap: 5px;
			grid-column-gap: 10px;
			margin-bottom: 10px;
		}
		.stacked-container-grid {
			display: grid;
			grid-row-gap: 5px;
			grid-column-gap: 10px;
			margin-bottom: 10px;
		}
		.container-grid-fivecolumn {
			display: grid;
			grid-template-columns: 100px 60px 5px 60px 20px;
			grid-row-gap: 5px;
			grid-column-gap: 10px;
			margin-bottom: 10px;
		}
		.mytext{
			color: pink;
		}
		
		.angle-container-grid {
			display: grid;
			grid-template-columns: 120px 120px ;
			grid-row-gap: 5px;
			grid-column-gap: 10px;
			margin-bottom: 10px;
		}
		.LeftCorner {
    		position: absolute;
    		top: 10;
    		left: 10;
		}

		.ButtonContext {
    		font-size: 16px;
    		color: black;
    		margin: 5px;
    		padding: 8px 16px;
    		background-color: pink;
    		text-decoration: none;
    		border-radius: 4px;
		}
	</style>
	<script>
		function toggleView(el) {

			let display = 'none';
			let label = 'Show';
			let top = el;

			if (el.innerHTML.toUpperCase() == 'SHOW') {
				display = 'grid';
				label = 'Hidden';
			}

			// set label
			el.innerHTML = label;

			while ((top = top.nextElementSibling)) {

				if (top.nodeName !== 'SCRIPT')
					top.style.display = display;
			}
		}
	</script>

</head>
<body style="background-color: rgb(84, 0, 38);">
	<div class="LeftCorner">
		<a class="ButtonContext"  href="../index.html">
            🏠︎ กลับหน้าหลัก
    	</a>
				<a class="ButtonContext"  href="../AnswerFinder/index.htm">
            ↔ สลับโหมด 
    	</a>
	</div>
	<div id="display-container" style="display: flex; align-items: center; flex-direction: column;">
		<h1 style="margin-bottom: 20px;">
			<b><text style="font-size:49px;font-family:'Bahnschrift' ;color:white";>Simulator-Pin Exporter
			</b></text>
		</h1>
		<div style="display: flex; flex-direction: column; align-items: center;">
			<div id="wedegt-config" style="display: flex; flex-direction: column; z-index: 10; padding: 10px">
				<div>
					<label style="color:pink; font-size:20px"><b>Client config</b></text></label>
					<button id="toggleView" onclick="toggleView(this)">Hide</button>
					<div class="container-grid" style="padding-top: 10px; grid-template-columns: auto 120px auto;">
				<label class="label">จอ: </label><select class="input" id="dis">
					<option value="1">PB BIG</option>
					<option value="1">800x600</option>
					<option value="1.25">800x600 pb เล็ก</option>
					<option value="1.5">1280x720</option>
					<option value="1.875">1600x900</option>
				</select>
					</div><br>
					<label style="color:pink"><text style="font-size:20px"><b>Character status</b></text></label>
					<div class="angle-container-grid" style="padding-top: 10px;">
						<label class="label" >Power รวม :</label>
						<input class="input" id="power" type="text" value="37">
						<label class="label">ระยะแหวน (y) :</label>
						<input class="input" id="auxpart_pwr" type="text" value="-8">
						<label class="label">การ์ด Lolo (y) :</label>
						<input class="input" id="card_ps_pwr" type="text" value="0">
						<label hidden class="label">Card Power :</label>
						<input hidden class="input" id="card_pwr" type="text" value="0">
						<label hidden class="label">Mascot Power :</label>
						<input hidden class="input" id="mascot_pwr" type="text" value="0">
						<label class="label">ระยะไม้ของคุณ =</label>
						<input class="output" id="current_drive" type="text" <text style="color:Red"></text>
					</div>
						<div style="display: grid; grid-template-columns: 70px 120px auto;">
						<button style="width: 250px; height: 50px" onClick="checkdrive(this)"><b><text style="color:Red"><text style="font-size:20px">เช็คระยะไม้</text></b></button>
				</div>
			</div>
		

			<label style="color:pink"><br><text style="font-size:20px"><b>Configs</b></text></label>
			<div class="angle-container-grid" style="padding-top: 10px;">
				<label class="label">เลือกไม้ : </label><select class="input" id="club">
					<option value="0">1W</option>
					<option value="1">2W</option>
					<option value="2">3W</option>
					<option value="3">2I</option>
					<option value="4">3I</option>
					<option value="5">4I</option>
					<option value="6">5I</option>
					<option value="7">6I</option>
					<option value="8">7I</option>
					<option value="9">8I</option>
					<option value="10">9I</option>
					<option value="11">PW</option>
					<option value="12">SW</option>
				</select>
				<label class="label">เลือกท่าตี : </label><select class="input" id="shot">
					<option value="0">Dunk</option>
					<option value="1">Tomahawk</option>
					<option value="2">Spike</option>
					<option value="3">Cobra</option>
				</select>
				<label class="label">จำนวนเกจ : </label><select class="input" id="power_shot">
				<option value="0">Normal Shot</option>
				<option value="1">1 Power Shot</option>
				<option value="2">2 Power Shot</option>
				<option value="3">15y Power Shot</option>
				</select>
			</div>
				<div>
					<label style="color:pink"><br><br><text style="font-size:20px"><b>Mycella Slope Formula</b></text></label>
					<button id="toggleView" onclick="toggleView(this)">Hide</button>
					<div id="mycella" class="angle-container-grid" style="padding-top: 10px;">
						<label class="label">ตัวคูณเอียง:</label>
						<input class="input" id="x-slope" type="text">
						<label class="label">PX:</label>
						<input class="input" id="px" type="text">
						<label class="label">DG:</label>
						<input class="input" id="align-degree" type="text">
						<label class="label">+/-:</label>
						<select class="input" id="slope-side">
							<option value="+1">+</option>
							<option value="-1">-</option>
						</select>
						<label class="label">Slope Break:</label>
						<input class="input" id="slopebreak" type="text">
						<input type="reset" value="Cal" onClick="calcMycella(this)">
					</div>	
				</div>

			<div>
					<label style="color:pink"><br><br><text style="font-size:20px"><b>คำนวนองศาลม</b></text></label>
					<button id="toggleView" onclick="toggleView(this)">Hide</button>
					<div id="anglecalc" class="angle-container-grid" style="padding-top: 10px">
						<label id="anglecalc" class="label">ใส่องศาแบบ 90 : </label>
						<input class="input" id="degree90" type="text">
						<button onClick="anglecalc1(this)">◤</button>
						<button onClick="anglecalc4(this)">◥</button>
						<button onClick="anglecalc2(this)">◣</button>
						<button onClick="anglecalc3(this)">◢</button>
						<label class="label">Real DG :</label>
						<input class="input" id="winddeg" type="text">
					</div>
			</div>	

		<form>
			<label style="color:pink"><br><br><text style="font-size:20px"><b>Export Answer Data</b></text></label>
			<input type="reset" value="Clear" name="data">
			<br>
			<br>
			<div class="stacked-container-grid">
				<div class="container-grid-fivecolumn">
					<label class="mytext">แรงตีที่ใช้ : </label>
					<input id="power_used1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="power_used2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="powerusedcheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">หลุมสูงต่ำ : </label>
					<input id="height1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="height2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="heightcheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">แรงลม : </label>
					<input id="wind1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="wind2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="windcheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">องศาลม : </label>
					<input id="degree1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="degree2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="degreecheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">ลูกเอียง : </label>
					<input id="slope1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="slope2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="slopecheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">เอฟเฟคลูก : </label>
					<input id="ground1" value="100" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="ground2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="groundcheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">สปิน : </label>
					<input id="spin1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata" id="spin2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="spincheckbox" type="checkbox">
				</div>
				<div class="container-grid-fivecolumn">
					<label class="mytext">เคิฟ : </label>
					<input id="curve1" type="text">
					<label class="mytext">-</label>
					<input class="destinationdata"id="curve2" type="text" disabled>
					<input onchange="tickCheckBox(this)" class="databool" id="curvecheckbox" type="checkbox">
				</div>
			</div>
			<div class="angle-container-grid"><br>
				<label class="label">Aim : </label>
				<input class="input" id="aim" value="4" type="text">
				<label class="label">ความห่างข้อมูล 1 : </label>
				<input class="input" id="datafrequency" value="1" type="text">
				<label class="label">ความห่างข้อมูล 2 : </label>
				<input class="input" id="data2freq" value="1" type="text"><br>
			</div>
			<div style="padding-top: 5px;">
				<input type="checkbox" id="includeSensitivity" checked>
				<label for="includeSensitivity" class="mytext">Diff Calculation</label><br>

			</div>
		</form>
		<div style="display: grid; grid-template-columns: 90px 250px auto; padding-top: 10px;">
			<button style="width: 250px; height: 40px" onClick="exportSweep()"><b><text style="color:Green"><text style="font-size:24px">Export XLSX</text></b></button>
		</div>
		</div>
		<span style="margin-top: 5px;">
			<font id="export-status" style="color:cyan"></font><br>
		</span>
		<rodape style="padding: 10px; font-size: 10px; color:pink"><b>Developed by Acrisio SuperSS Dev<b></rodape>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
	<script src="smart_calculator.js"></script>
</body>
</html>
